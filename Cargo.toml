[package]
name         = "cantos"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.77"
description  = "Hot corners for Windows, macOS and Linux"
authors      = ["kidchenko <kidchenko@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/kidchenko/windows-cantos"

[[bin]]
name = "cantos"
path = "src/main.rs"

[dependencies]
muda = "0.19"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tray-icon = "0.24"

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
[target.'cfg(windows)'.dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# The build script's cfg matches the host: resource embedding only happens when
# building on Windows, which is where the Windows release is built anyway.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
# On a Mac the Dock detects the corners and Cantos edits its settings
# (native.rs), so there is no cursor polling here. The few CoreGraphics and
# CoreFoundation functions used (displays for the diagram, the Dock's
# preferences) are declared by hand. `libc` is for localtime_r in the log
# stamp and dlopen of the private Dock and lock-screen entry points behind the
# Test button (actions.rs). objc2 is already in the tree via tao and
# tray-icon; AppKit for the activation policy and the Edit menu, Foundation
# for the preference values, ServiceManagement for run-at-login.
[target.'cfg(target_os = "macos")'.dependencies]
libc                     = "0.2"
objc2                    = "0.6"
# The native settings window (ui/window_mac.rs) is most of the AppKit list.
dispatch2                = "0.3"
objc2-app-kit            = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSAppearance", "NSAttributedString", "NSParagraphStyle", "NSApplication", "NSBezierPath", "NSBitmapImageRep", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSImageView", "NSMenu", "NSMenuItem", "NSPopUpButton", "NSResponder", "NSRunningApplication", "NSSwitch", "NSText", "NSTextField", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation         = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSString", "NSValue"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
# X11 only, and loaded at runtime rather than linked: `x11-dl` is already in the
# tree via tao, and dlopen means the binary still starts on a machine without
# libXtst or libXrandr and says so in the log. See desktop.rs on Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
# The settings window (ui/window_gtk.rs). Already in the tree for the tray.
gtk    = "0.18"
libc   = "0.2"
x11-dl = "2.21"

# Size is a first-class goal: this profile is what keeps the shipped
# binary in the ~3-4 MB range rather than ~12 MB.
[profile.release]
opt-level     = "z"     # optimise for size over speed; nothing here is hot
lto           = true    # cross-crate dead-code elimination
codegen-units = 1       # better optimisation at the cost of build time
panic         = "abort" # drops the unwinding tables
strip         = true    # no symbols in the shipped binary
